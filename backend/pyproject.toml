[project]
name = "inclua-beauty-ai"
version = "0.1.0"
description = "Inclua Beauty AI — plataforma agêntica para acessibilidade de embalagens de beleza"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "pydantic[email]>=2.7",
    "pydantic-settings>=2.3",
    "PyJWT>=2.8",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
# Camada agêntica de produção (Google ADK + Vertex AI/Gemini).
# Opcional: sem isso, a plataforma roda com o analisador heurístico determinístico.
adk = [
    "google-adk>=0.2",
    "google-genai>=0.3",
]
postgres = [
    "psycopg[binary]>=3.1",
    "pgvector>=0.2",
]
dev = [
    "pytest>=8.2",
    "httpx>=0.27",
    "ruff>=0.5",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
